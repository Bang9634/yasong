# MySQL 운영 환경 설정
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yasongmuseum?useSSL=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:yasongmuseum_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Secret Key (환경 변수로 관리 - 절대 하드코딩 금지!)
# 생성: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}

# JPA 운영 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 보안 헤더
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false