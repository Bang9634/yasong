# MySQL 운영 환경 설정
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yasongmuseum?useSSL=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Secret Key (환경 변수로 관리 - 절대 하드코딩 금지!)
# 생성: openssl rand -base64 64
# 로컬 테스트용 기본값 (운영에서는 반드시 환경 변수 설정!)
jwt.secret=${JWT_SECRET:zETF3zUqQH8hy3u64ARV53FTUTNw33idHgzAOKqhcswAuz6AQawnuJPvoZ/ntlrdxLk9ITk9CfZHhN9QkTxJBA==}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}

# JPA 운영 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway 마이그레이션 설정 (Hibernate보다 먼저 실행)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# 보안 헤더
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ==================== Performance Optimization ====================
# DB 서버와 웹 서버 분리 환경 (각 1GB) 최적화

# HikariCP Connection Pool (원격 DB 연결 최적화)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Logging Level (디스크 I/O 감소)
logging.level.root=WARN
logging.level.com.bang9634.yasongmuseum=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

# Tomcat Thread Pool (웹 전용 서버 최적화)
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=50
server.tomcat.max-connections=200
server.tomcat.connection-timeout=20000

# ==================== Google Analytics ====================
# Google Analytics Data API 설정
# Property ID는 Google Analytics 대시보드에서 확인 가능 (관리 > 속성 설정 > 속성 ID)
google.analytics.property-id=${GA_PROPERTY_ID:}
# Service Account JSON 파일 경로 (절대 경로 또는 상대 경로)
# 예: /home/user/service-account.json 또는 classpath:google-analytics-key.json
google.analytics.credentials-path=${GA_CREDENTIALS_PATH:}
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=50
server.tomcat.max-connections=200
server.tomcat.connection-timeout=20000