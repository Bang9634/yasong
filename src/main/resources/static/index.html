    <script>
      (function() {
        function getBrowserInfo() {
          var ua = navigator.userAgent;
          var browser = {
            name: 'unknown',
            version: 0,
            isSupported: true
          };

          // IE 감지
          if (ua.indexOf('MSIE') !== -1 || ua.indexOf('Trident/') !== -1) {
            browser.name = 'IE';
            browser.version = 0;
            browser.isSupported = false;
            return browser;
          }

          // Edge Legacy 감지 (EdgeHTML)
          if (ua.indexOf('Edge/') !== -1) {
            var match = ua.match(/Edge\/(\d+)/);
            browser.name = 'Edge Legacy';
            browser.version = match ? parseInt(match[1]) : 0;
            browser.isSupported = false;
            return browser;
          }

          // Chrome 감지
          if (ua.indexOf('Chrome/') !== -1 && ua.indexOf('Edg/') === -1) {
            var match = ua.match(/Chrome\/(\d+)/);
            browser.name = 'Chrome';
            browser.version = match ? parseInt(match[1]) : 0;
            browser.isSupported = browser.version >= 61;
            return browser;
          }

          // Edge Chromium 감지
          if (ua.indexOf('Edg/') !== -1) {
            var match = ua.match(/Edg\/(\d+)/);
            browser.name = 'Edge';
            browser.version = match ? parseInt(match[1]) : 0;
            browser.isSupported = browser.version >= 79;
            return browser;
          }

          // Firefox 감지
          if (ua.indexOf('Firefox/') !== -1) {
            var match = ua.match(/Firefox\/(\d+)/);
            browser.name = 'Firefox';
            browser.version = match ? parseInt(match[1]) : 0;
            browser.isSupported = browser.version >= 60;
            return browser;
          }

          // Safari 감지
          if (ua.indexOf('Safari/') !== -1 && ua.indexOf('Chrome') === -1) {
            var match = ua.match(/Version\/(\d+)/);
            browser.name = 'Safari';
            browser.version = match ? parseInt(match[1]) : 0;
            browser.isSupported = browser.version >= 11;
            return browser;
          }

          return browser;
        }

        function showBrowserWarning(browserInfo) {
          var modal = document.createElement('div');
          modal.id = 'browser-warning-modal';
          modal.innerHTML = 
            '<div id="browser-warning-content">' +
            '<div class="warning-icon">⚠️</div>' +
            '<h2>브라우저 호환성 경고</h2>' +
            '<p>현재 사용 중인 브라우저(' + browserInfo.name + 
            (browserInfo.version > 0 ? ' ' + browserInfo.version : '') + 
            ')는 이 웹사이트를 정상적으로 표시하지 못할 수 있습니다.</p>' +
            '<p><strong>권장 브라우저:</strong></p>' +
            '<ul>' +
            '<li>Chrome 61 이상 (2017년 9월 이후)</li>' +
            '<li>Firefox 60 이상 (2018년 5월 이후)</li>' +
            '<li>Safari 11 이상 (2017년 9월 이후)</li>' +
            '<li>Edge 79 이상 (2020년 1월 이후)</li>' +
            '</ul>' +
            '<p>최신 브라우저로 업데이트하시면 더 나은 경험을 제공받으실 수 있습니다.</p>' +
            '<button onclick="document.getElementById(\'browser-warning-modal\').style.display=\'none\'">계속 진행</button>' +
            '</div>';
          
          document.body.appendChild(modal);
          modal.style.display = 'block';
        }

        // 페이지 로드 시 브라우저 체크
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            var browserInfo = getBrowserInfo();
            if (!browserInfo.isSupported) {
              showBrowserWarning(browserInfo);
            }
          });
        } else {
          var browserInfo = getBrowserInfo();
          if (!browserInfo.isSupported) {
            showBrowserWarning(browserInfo);
          }
        }
      })();
    </script>
