spring.application.name=yasongmuseum

# Profile 설정
# 실행 시 커맨드라인으로 지정: --spring.profiles.active=local 또는 --spring.profiles.active=prod
# 기본값(지정하지 않으면): local
spring.profiles.default=local

# JPA 설정
# none: Hibernate는 스키마 관리하지 않음 (Flyway에 위임)
# validate: 운영 환경에서는 이것 사용 (스키마 검증만)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Performance optimization: Disable Open-In-View to save memory
# View 렌더링까지 DB 커넥션 유지하지 않음
spring.jpa.open-in-view=false

# Lazy initialization for faster startup
spring.main.lazy-initialization=true

# Flyway 설정
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT 공통 설정
jwt.expiration=86400000
jwt.secret=CHANGE-THIS-TO-YOUR-SECRET-KEY-IN-PROFILE-SPECIFIC-FILES

# File Upload 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads
file.upload.hero.dir=hero
file.upload.max-size=10485760