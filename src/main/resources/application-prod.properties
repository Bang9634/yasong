# MySQL 운영 환경 설정
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yasongmuseum?useSSL=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Secret Key (환경 변수로 관리 - 절대 하드코딩 금지!)
# 생성: openssl rand -base64 64
# 로컬 테스트용 기본값 (운영에서는 반드시 환경 변수 설정!)
jwt.secret=${JWT_SECRET:zETF3zUqQH8hy3u64ARV53FTUTNw33idHgzAOKqhcswAuz6AQawnuJPvoZ/ntlrdxLk9ITk9CfZHhN9QkTxJBA==}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}

# JPA 운영 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 보안 헤더
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ==================== Performance Optimization ====================

# HikariCP Connection Pool (1GB 서버 최적화)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Level (디스크 I/O 감소)
logging.level.root=WARN
logging.level.com.bang9634.yasongmuseum=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Tomcat Thread Pool (동시 처리 최적화)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=10
server.tomcat.max-connections=100